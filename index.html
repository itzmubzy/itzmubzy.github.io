<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f1" />
    <meta
      name="description"
      content="KM Mubin is a data science student building practical, evidence-led solutions with Python, statistics, and machine learning."
    />
    <title>KM Mubin - Data Science Portfolio</title>
    <script>
      (() => {
        const storedTheme = localStorage.getItem('km-mubin-theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = storedTheme || (prefersDark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
